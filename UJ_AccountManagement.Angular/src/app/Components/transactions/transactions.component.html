<!-- Transaction Filters -->
<div class="m-4 ms-2 mt-2 d-flex flex-column">
  <div class="card p-2 shadow-sm align-self-end">
    <div class="d-flex flex-wrap align-items-center gap-1">
      <!-- Filter Selection -->
      <select [(ngModel)]="selectedFilter" class="form-select w-auto" (change)="onFilterChange()">
        <option value="all">All Transactions</option>
        <option value="id">By ID</option>
        <option value="search">By Keyword</option>
        <option value="date">By Date</option>
        <option value="account">By Account Holder</option>
        <option value="advanced">Advanced Filters</option>
      </select>

      <!-- Filter Input Fields -->
      <input *ngIf="selectedFilter === 'id'" type="number" class="form-control w-auto" placeholder="Transaction ID">
      <input *ngIf="selectedFilter === 'search'" type="text" class="form-control w-auto" placeholder="Search Transactions">
      <input *ngIf="selectedFilter === 'account'" type="text" class="form-control w-auto" placeholder="Account Holder">

      <!-- By Date Filters -->
      <ng-container *ngIf="selectedFilter === 'date'">
        <input placeholder="Start Date"
               class="form-control w-auto"
               type="text"
               onfocus="(this.type='date')"
               onblur="(this.type='text')"
               id="date" />
        <input placeholder="End Date"
               class="form-control w-auto"
               type="text"
               onfocus="(this.type='date')"
               onblur="(this.type='text')"
               id="date" />
      </ng-container>

      <!-- Advanced Filters -->
      <ng-container *ngIf="selectedFilter === 'advanced'">
        <input type="text" class="form-control w-auto" placeholder="Account Holder">
        <input type="number" class="form-control w-auto" placeholder="Account ID">
        <input type="text" class="form-control w-auto" placeholder="Transaction Type">
        <input placeholder="Start Date"
               class="form-control w-auto"
               type="text"
               onfocus="(this.type='date')"
               onblur="(this.type='text')"
               id="date" />
        <input placeholder="End Date"
               class="form-control w-auto"
               type="text"
               onfocus="(this.type='date')"
               onblur="(this.type='text')"
               id="date" />
      </ng-container>

      <button class="btn btn-primary">Search</button>
    </div>
  </div>

  <button class="btn btn-success align-self-end mt-2 me-0"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasRight"
          aria-controls="offcanvasRight">
    Add Transaction
  </button>

</div>


<!-- Transaction Table -->

  <div class="container-fluid pb-5">
      <ag-grid-angular style="width: 100%; height: 700px;"
                       class="ag-theme-balham"
                       [rowData]="TransactionData"
                       [columnDefs]="colDefs"
                       [defaultColDef]="defaultColDef"
                       [animateRows]="true"
                       [pagination]="true">
      </ag-grid-angular>
  </div>


<!-- Add Transaction -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
  <div class="offcanvas-header bg-success text-white">
    <h5 class="offcanvas-title" id="offcanvasRightLabel">New Transaction</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <form (ngSubmit)="onAddTransactionSubmit()" novalidate>

      <div class="mb-3">
        <label for="accountHolder" class="form-label">Account Holder:</label>

        <!-- Input with datalist -->
        <input list="accountHolders"
               id="accountHolder"
               name="accountHolder"
               class="form-control w-100"
               placeholder="Select or type an account holder"
               (input)="onAccountHolderInput($event)">

        <!-- Dynamic datalist options -->
        <datalist id="accountHolders">
          <option *ngFor="let customer of customers" [value]="customer.accountHolder"></option>
        </datalist>
      </div>


      <div class="mb-3">
        <label for="accountId" class="form-label">Account ID:</label>
        <input type="number" id="accountId" name="accountId" disabled [(ngModel)]="AddTransactionData.accountId"
               class="form-control w-100" placeholder="Enter Account ID" required>
      </div>

      <!-- Transaction Type -->
      <div class="mb-3">
        <label for="transactionType" class="form-label">Transaction Type:</label>
        <select id="transactionType" name="transactionType" [(ngModel)]="AddTransactionData.transactionType"
                class="form-select" required>
          <option value="" selected disabled hidden>Select Transaction Type</option>
          <option value="Deposit">Deposit</option>
          <option value="Withdrawal">Withdrawal</option>
          <option value="Transfer">Transfer</option>
        </select>
      </div>

      <!-- Amount -->
      <div class="mb-3">
        <label for="amount" class="form-label">Amount:</label>
        <input type="number" step="0.01" id="amount" name="amount" [(ngModel)]="AddTransactionData.amount"
               class="form-control w-100" placeholder="Enter Amount" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-success w-100">Submit</button>
    </form>
  </div>
</div>
